<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Get in touch with White Water Wasatch Rafting. Find our address, phone, email, and meet our guides, or send us a message using our contact form.">
    <meta name="author" content="Nathan Hardy">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Wasatch Rafting</title>
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Wasatch Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-intro">
            <h1>White Water Wasatch Rafting</h1>
            <address>
                <p>123 River Road</p>
                <p>Moab, UT 84532</p>
                <p><a href="tel:+18015551234">(801) 555-1234</a></p>
                <p><a href="mailto:info@whitewaterwasatch.com">info@whitewaterwasatch.com</a></p>
            </address>
        </section>

        <div class="contact-main">
            <iframe class="map" src="https://www.google.com/maps?q=Moab,Utah&output=embed"
              title="Map showing the location of White Water Wasatch Rafting"
              loading="lazy"></iframe>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset class="form-row">
                    <legend>Message Purpose</legend>
                    <div class="radio-option">
                        <input type="radio" id="purpose-general" name="purpose" value="general"
                          checked>
                        <label for="purpose-general">General Inquiry</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="reservation">
                        <label for="purpose-reservation">Reservation Question</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="purpose-suggestion" name="purpose"
                          value="suggestion">
                        <label for="purpose-suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-row checkbox-option">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/jason-collins.jpg" alt="Portrait of Jason Collins">
                    <figcaption>Jason Collins<br>Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/marcus-diaz.jpg" alt="Portrait of Marcus Diaz">
                    <figcaption>Marcus Diaz<br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/priya-nair.webp" alt="Portrait of Priya Nair">
                    <figcaption>Priya Nair<br>Operations Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 White Water Wasatch Rafting | Nathan Hardy</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
